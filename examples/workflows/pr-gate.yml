# Add to .github/workflows/move-coverage.yml in your Move repo
# Layer 1 only — no sui needed, runs in seconds
name: move-coverage
on: [pull_request]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: talongate/move-test-gen@b878ba142e3853ee067702b56a40267fc857cf44 # v1.5.1
        with:
          sources: sources
          tests: tests
